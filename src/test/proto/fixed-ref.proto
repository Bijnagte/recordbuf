// Reference counterpart of fixed.proto for the fixed/int/float scalar family
// interop test.
// Same message shape + field numbers; DIFFERENT java_package so the
// protobuf-java reference type (Sample) lives in a sibling package and does
// not collide with the recordbuf record of the same name. The wire bytes
// are field-number-driven and so are identical regardless of Java package.
syntax = "proto3";
package bijnagte.recordbuf.comgen.fixed.ref;
option java_package = "bijnagte.recordbuf.comgen.fixed.ref";
option java_multiple_files = true;

message Sample {
  uint32  a = 1;
  int32   b = 2;
  int64   c = 3;
  uint64  d = 4;
  fixed32 e = 5;
  fixed64 f = 6;
  sfixed32 g = 7;
  sfixed64 h = 8;
  double  i = 9;
  float   j = 10;
  sint32  k = 11;
  sint64  l = 12;
}
