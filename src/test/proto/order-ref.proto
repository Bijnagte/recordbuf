// protobuf-java reference counterpart of order.proto (see its header). The only
// difference is the java_package (suffixed .ref) + java_multiple_files so the
// generated reference type lands in a sibling package and won't collide with the
// record. The field NUMBERS are still declared non-ascending, so the wire bytes
// only match if the generated encode loop sorts by field number.
syntax = "proto3";
package bijnagte.recordbuf.comgen.order.ref;
option java_package = "bijnagte.recordbuf.comgen.order.ref";
option java_multiple_files = true;

message Sample {
    int32 c = 3;
    int32 a = 1;
    int32 b = 2;
}
