// Reference counterpart of compat.proto for the combined end-to-end interop test.
// Same message shapes + field numbers; a DIFFERENT java_package (with
// java_multiple_files = true) so the protobuf-java reference types (Compat/Sub)
// live in a sibling `*.ref` package and do not collide with the recordbuf
// records of the same name. The wire bytes are field-number-driven and so are
// identical regardless of Java package.
syntax = "proto3";
package bijnagte.recordbuf.comgen.combined.ref;
option java_package = "bijnagte.recordbuf.comgen.combined.ref";
option java_multiple_files = true;

message Compat {
    int32        i        = 1;
    fixed64      fx       = 2;
    string       s        = 3;
    bytes        b        = 4;
    repeated int32 packed = 5;
    Sub          nested   = 6;
    repeated Sub subs     = 7;
    map<string, int32> m  = 8;
    optional int32 presence = 9;
}

message Sub {
    int32  id    = 1;
    string label = 2;
}
