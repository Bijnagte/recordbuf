[versions]
spring-boot = "4.2.0"
protobuf = "4.36.2"
gradle-protobuf = "0.10.1"
recordbuf = "0.0.1-SNAPSHOT"
spotless = "8.11.0"
google-java-format = "2.0.0"

[libraries]
recordbuf-runtime = { module = "io.github.bijnagte.recordbuf:recordbuf-runtime", version.ref = "recordbuf" }
recordbuf-json = { module = "io.github.bijnagte.recordbuf:recordbuf-json", version.ref = "recordbuf" }
recordbuf-avro = { module = "io.github.bijnagte.recordbuf:recordbuf-avro", version.ref = "recordbuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
