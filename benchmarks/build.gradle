// NOTE: This module is intentionally Groovy (build.gradle, not .kts), mirroring
// :recordbuf-fixtures. The protobuf-gradle-plugin's per-task DSL is not cleanly
// drivable from Kotlin (see the extensive comment block in fixtures/build.gradle).

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.1'
    }
}

plugins {
    alias(libs.plugins.gradle.errorprone)
    alias(libs.plugins.jmh)
}

apply plugin: 'java-library'
apply plugin: 'com.google.protobuf'

tasks.named('jmh') {
    // Allocation profiler: measures bytes allocated per operation.
    jmhArgs = '-prof gc'
}
def GenerateProtoTask = 'com.google.protobuf.gradle.GenerateProtoTask'

// The managed protoc version (matches fixtures).
def protocArtifact = 'com.google.protobuf:protoc:4.36.2'
def protobufJava = 'com.google.protobuf:protobuf-java:4.36.2'

// The recordbuf launcher (same as fixtures).
def recordbufLauncher = project(':recordbuf-generator').file(
    'build/install/protoc-gen-recordbuf/bin/protoc-gen-recordbuf',
).absolutePath

// The options proto directory.
def optionsProtoDir = project(':recordbuf-options').file('src/main/proto')

sourceSets {
    main {
        proto {
            srcDir optionsProtoDir
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':recordbuf-runtime')
    implementation project(':recordbuf-json')
    implementation project(':recordbuf-avro')
    implementation libs.jspecify
    implementation protobufJava

    errorprone libs.nullaway
    errorprone libs.error.prone.core
}

// WKT include dir (extracted from the protobuf-java jar).
def wktIncludeDir = layout.buildDirectory.dir('wkt-include')
def extractWkt = tasks.register('extractWkt', Copy) {
    from configurations.runtimeClasspath
    include 'google/protobuf/*.proto'
    into wktIncludeDir
}

protobuf {
    protoc {
        artifact = protocArtifact
    }
    plugins {
        create('recordbuf') {
            path = recordbufLauncher
        }
    }
    generateProtoTasks {
        ofSourceSet('main')
        all().configureEach { task ->
            task.plugins.create('recordbuf')
            if (task.name == 'generateProto') {
                task.plugins.getByName('recordbuf').option('package_suffix=.rec')
task.getIncludeDirs().from(optionsProtoDir)
            }
        }
    }
}

// Generation depends on installDist so the launcher exists before protoc runs.
def recordbufInstallDir = project(':recordbuf-generator').layout.buildDirectory
    .dir('install/protoc-gen-recordbuf').get().asFile
['generateProto'].each { n ->
    tasks.named(n, Class.forName(GenerateProtoTask)).configure {
        dependsOn ':recordbuf-generator:installDist'
        inputs.dir(recordbufInstallDir)
    }
}

// Error Prone + NullAway on the generated .rec output (mirrors fixtures).
tasks.named("compileJava", JavaCompile).configure {
    options.errorprone {
        error("UnnecessarilyFullyQualified")
        error("NullAway")
        option("NullAway:OnlyNullMarked", "true")
        disable("UndefinedEquals")
        // Exclude the protobuf-java reference and Avro-specific generated records.
        excludedPaths = '.*/proto/main/java/.*|.*Avro.java|.*RecordbufUnknownField.java|.*RecordbufOneofValue.java|.*RecordbufDynamicWkt.java|.*avro/wkt/.*'
    }
}

// Disable Error Prone for JMH benchmark code (not part of the generated .rec output).
tasks.named("compileJmhJava", JavaCompile).configure {
    options.errorprone {
        disableAllChecks = true
    }
}

// ---------------------------------------------------------------------------
// Profiling: ./gradlew :recordbuf-benchmarks:profile -Pbench=ConformanceBenchmark.decode
//
// Runs one benchmark (a JMH include regex) under JFR and prints the top CPU and allocation
// frames as text. If ASYNC_PROFILER_LIB points at libasyncProfiler.{dylib,so}, async-profiler also
// runs and writes a CPU flame graph. Artifacts land in build/profiles/<bench>/ (never committed).
// The `jmh` task is untouched.
// ---------------------------------------------------------------------------
def profileLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('profile', JavaExec) {
    group = 'verification'
    description = 'Profiles one benchmark (-Pbench=<regex>) with JFR (+ async-profiler when ASYNC_PROFILER_LIB is set).'
    dependsOn tasks.named('jmhJar')
    javaLauncher = profileLauncher

    def bench = providers.gradleProperty('bench')
    def quick = providers.gradleProperty('profileQuick').isPresent()
    def asyncLib = providers.environmentVariable('ASYNC_PROFILER_LIB')
    def outDir = layout.buildDirectory.dir(bench.map { 'profiles/' + it.replaceAll('[^A-Za-z0-9_.-]', '_') })
    def jfrFile = outDir.map { it.file('profile.jfr') }

    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'

    doFirst {
        if (!bench.isPresent()) {
            throw new GradleException(
                'Missing -Pbench=<benchmark regex>, e.g. ' +
                    '-Pbench=ConformanceBenchmark.decode (use -PprofileQuick for a shorter run)')
        }
        def dir = outDir.get().asFile
        delete(dir)
        dir.mkdirs()

        // DebugNonSafepoints makes sampled frames land on real lines inside inlined code.
        def jvmArgs = "-XX:StartFlightRecording=filename=${jfrFile.get().asFile},settings=profile" +
            ' -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints'
        def jmhArgs = [bench.get(), '-f', '1', '-jvmArgsAppend', jvmArgs]
        if (quick) {
            jmhArgs += ['-wi', '2', '-i', '3', '-w', '1', '-r', '2']
        }

        def lib = asyncLib.getOrNull()
        if (lib == null) {
            logger.lifecycle('profile: ASYNC_PROFILER_LIB not set; JFR only.')
        } else if (!file(lib).isFile()) {
            logger.lifecycle("profile: ASYNC_PROFILER_LIB=${lib} does not exist; JFR only.")
        } else {
            logger.lifecycle("profile: async-profiler enabled (${lib}).")
            jmhArgs += ['-prof', "async:libPath=${lib};output=flamegraph;event=cpu;dir=${dir}"]
        }
        args(jmhArgs)
    }

    doLast {
        def jfr = profileLauncher.get().metadata.installationPath.file('bin/jfr').asFile
        def rec = jfrFile.get().asFile
        if (!rec.isFile()) {
            throw new GradleException("profile: no JFR recording produced at ${rec}")
        }
        ['hot-methods', 'allocation-by-site'].each { view ->
            def proc = new ProcessBuilder(
                jfr.absolutePath, 'view', '--width', '160', view, rec.absolutePath)
                .redirectErrorStream(true).start()
            def text = proc.inputStream.text
            proc.waitFor()
            def lines = text.readLines()
            logger.lifecycle("\n== jfr view ${view} (top 15 rows) ==")
            if (lines.size() <= 3) {
                logger.lifecycle("(no samples for ${view})")
            } else {
                logger.lifecycle(lines.take(18).join('\n'))
            }
        }
        logger.lifecycle('\nArtifacts:')
        fileTree(outDir).visit { if (!it.isDirectory()) { logger.lifecycle("  ${it.file}") } }
    }
}
