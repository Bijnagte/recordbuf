[versions]
# Central version pins. Bump here, not in build.gradle.kts.
# All pins below are the latest GA as of Oct 2026, verified Java 25 + Gradle 9 compatible.
record-builder    = "53"
jspecify          = "1.0.0"
error-prone       = "2.51.0"
nullaway          = "0.14.3"
gradle-errorprone = "5.1.1"   # net.ltgt.errorprone Gradle plugin
protobuf          = "4.36.2"
junit-jupiter     = "5.11.3"

[libraries]
# io.soabase.record-builder does not publish a Gradle plugin as of v53; wire
# it as an annotation processor on the compile classpath.  `core` carries the
# generated `With` interface annotations, `processor` is the APT itself.
record-builder-core     = { group = "io.soabase.record-builder", name = "record-builder-core",     version.ref = "record-builder" }
record-builder-processor = { group = "io.soabase.record-builder", name = "record-builder-processor", version.ref = "record-builder" }
jspecify       = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
# Error Prone is itself an Error Prone checker; NullAway is loaded as an
# additional annotation processor through net.ltgt.errorprone.
error-prone-core    = { group = "com.github.errorprone", name = "error_prone_core", version.ref = "error-prone" }
error-prone-check   = { group = "com.github.errorprone", name = "error_prone_check_api", version.ref = "error-prone" }
nullaway            = { group = "com.uber", name = "nullaway", version.ref = "nullaway" }
# Protobuf runtime -- used to parse FileDescriptorProto in the plugin and
# consumed by GENERATED code (CodedInputStream/CodedOutputStream at user
# classpath). Pulled here so we can bump in one place.
protobuf            = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
protobuf-util       = { group = "com.google.protobuf", name = "protobuf-java-util", version.ref = "protobuf" }
junit-jupiter       = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-jupiter" }

[bundles]
test = ["junit-jupiter", "junit-platform-launcher"]

[plugins]
gradle-errorprone = { id = "net.ltgt.errorprone", version.ref = "gradle-errorprone" }
