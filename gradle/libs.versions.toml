[versions]
# Central version pins. Bump here, not in build.gradle.kts.
# All pins below are the latest GA as of Oct 2026, verified Java 25 + Gradle 9 compatible.
record-builder    = "53"
jspecify          = "1.0.1"
error-prone       = "2.51.0"
nullaway          = "0.14.3"
gradle-errorprone = "5.1.1"   # net.ltgt.errorprone Gradle plugin
spotless          = "8.11.0"   # diffplug Spotless Gradle plugin (latest, 2026-10)
# Checkstyle TOOL version (the checkstyle gradle plugin is built-in and needs no catalog
# plugin entry, but it otherwise defaults its tool to 10.24.0 -- far stale -- so we pin the
# tool version explicitly and reference it via `checkstyle.toolVersion` in the root build's
# subprojects block. 14.4.0 is the latest GA as of 2026-11 and requires JDK 21+, which this
# project's Temurin 25 toolchain satisfies. Checkstyle is the non-formatting gate; Spotless
# (google-java-format) owns formatting, so the two stay complementary, not competing.
checkstyle        = "14.4.0"
google-java-format = "2.0.0"   # latest (pulled from the catalog by build.gradle.kts)
                                # enum; its default cleanups (redundant semicolons,
                                # empty annotation parens, single-lambda parens) are ON
                                # -- the `.cleanup(false)` opt-out is NOT set here.
protobuf          = "4.36.2"
avro                = "1.12.2"
# NOTE: the com.google.protobuf (Protobuf-Gradle-plugin) version is pinned inline
# in fixtures/build.gradle's buildscript classpath as 0.10.1 (see that file).
# It is deliberately NOT a [plugins]-catalog entry: a catalog key named
# `protobuf-...` would be grouped under the `protobuf` version prefix and break
# the `libs.versions.protobuf` accessor.
junit-jupiter     = "5.11.3"
junit-platform    = "1.11.3"   # junit-platform-* modules are versioned 1.x, paired with jupiter 5.11.x
# Jackson (tools.jackson) -- the 3.x line (2026-11-21 migration): the generator's .avsc schema is
# BUILT as a Jackson JSON tree (serialized via writerWithDefaultPrettyPrinter(), parsed back in
# tests), and the :recordbuf-json runtime (2026-11-20 Jackson plan) EXPOSES the node types:
# node-typed dynamic WKTs and the J6 envelope payload. Bumped 2.22.1 -> 2.23.0 when :recordbuf-json
# landed, then 2.23.0 -> 3.1.8 (latest 3.x GA): the 3.x data formats moved to the tools.jackson
# group (single jackson-bom, no longer bom/core/data two-tier). One pin serves the generator,
# :recordbuf-json, and the fixtures. The retained com.fasterxml.jackson piece is ONLY the
# annotations jar (the 3.x line keeps it at 2.21.x per the 3.0 release notes) -- see
# `jackson-annotations` below.
jackson           = "3.1.8"
# com.fasterxml.jackson.core:jackson-annotations -- the 3.x line keeps annotations on its own
# 2.21.x cadence (a separate module, not covered by the jackson 3.x pin). Pinned at 2.21 (the GA
# coordinate has no patch suffix; the handoff's "2.21.0" 404s on Central) to match jackson-bom
# 3.1.8, which manages the same artifact at 2.21, so the two never diverge.
jackson-annotations = "2.21"
slf4j             = "2.0.20"   # org.slf4j -- latest GA (2.1.x is still alpha); generator-side logging only

[libraries]
# io.soabase.record-builder does not publish a Gradle plugin as of v53; wire
# it as an annotation processor on the compile classpath.  `core` carries the
# generated `With` interface annotations, `processor` is the APT itself.
record-builder-core     = { group = "io.soabase.record-builder", name = "record-builder-core",     version.ref = "record-builder" }
record-builder-processor = { group = "io.soabase.record-builder", name = "record-builder-processor", version.ref = "record-builder" }
jspecify       = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
# Error Prone is itself an Error Prone checker; NullAway is loaded as an
# additional annotation processor through net.ltgt.errorprone.
error-prone-core    = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "error-prone" }
error-prone-check   = { group = "com.google.errorprone", name = "error_prone_check_api", version.ref = "error-prone" }
nullaway            = { group = "com.uber.nullaway", name = "nullaway", version.ref = "nullaway" }
# Protobuf runtime -- used to parse FileDescriptorProto in the plugin and
# consumed by GENERATED code (CodedInputStream/CodedOutputStream at user
# classpath). Pulled here so we can bump in one place.
protobuf          = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
# protobuf-java-util -- JsonFormat, the proto3-JSON oracle the fixtures' canonical-JSON tests
# print .rec records through (record -> wire bytes -> reference message -> canonical text).
protobuf-java-util = { group = "com.google.protobuf", name = "protobuf-java-util", version.ref = "protobuf" }
# Avro (org.apache.avro) -- the alternative-wire-format bridge's runtime dependency.
# Pulled here so the Avro version is bumped in one place, next to the protobuf pin.
avro                = { group = "org.apache.avro", name = "avro", version.ref = "avro" }
# Avro's own schema->SpecificRecord generator (org.apache.avro.compiler.specific.SpecificCompiler).
# A GENERATION/build-time dependency only: the runtime bridge (:recordbuf-avro main + the
# WktAvroBridge converter) needs just the core `avro` artifact, so this sits on a build/gen
# classpath, never the runtime. `compiler` is its own sub-artifact (split out of core in 1.12);
# the specific record we consume compiles against core `avro` alone.
avro-compiler       = { group = "org.apache.avro", name = "avro-compiler", version.ref = "avro" }
# Jackson data binding -- explicit because the generator's .avsc emitter builds/serializes a Jackson
# JSON tree (see the `jackson` version above). Transitive of avro-compiler (the 2.x line); declared
# direct to name the generator's direct dependency rather than lean on a transitive.
jackson-databind    = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-bom         = { group = "tools.jackson", name = "jackson-bom", version.ref = "jackson" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson-annotations" }
# (the Formatter SPI's GJF-backed impl, U2). Pinned to the same 2.0.0 the Spotless gate uses,
# so first-party `src/` and the generated output share one formatting standard. generator-only:
# it is a Generation/build-time concern (R22 keeps the generated .rec surface dependency-free).
google-java-format  = { group = "com.google.googlejavaformat", name = "google-java-format", version.ref = "google-java-format" }
# SLF4J (org.slf4j) -- generator-side logging: the plugin's internal diagnostics (Main's request
# handling, CodeGenerator's per-file generation) log through slf4j-api, and slf4j-simple is the
# binding. slf4j-simple's ONLY output channel is stderr, so it can never touch the protoc
# plugin's stdout CodeGeneratorResponse protocol; its default level INFO keeps the launched
# plugin quiet (development debug is -Dorg.slf4j.simpleLogger.defaultLogLevel=debug).
# Generator module only -- the generated .rec surface stays dependency-free (R22).
slf4j-api         = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-simple      = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
junit-jupiter       = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[bundles]
test = ["junit-jupiter", "junit-platform-launcher"]

[plugins]
gradle-errorprone = { id = "net.ltgt.errorprone", version.ref = "gradle-errorprone" }
spotless          = { id = "com.diffplug.spotless", version.ref = "spotless" }
