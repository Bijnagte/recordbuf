name: publish

# Publishes the consumer modules to Maven Central (Central Portal) when a version tag is pushed:
#
#   git tag v0.0.2 && git push origin v0.0.2
#
# The tag is the version: `v0.0.2` publishes `0.0.2`. Gradle's maven-publish stages all modules into one
# directory, then JReleaser signs them and uploads them as a SINGLE Portal deployment. It stays in the
# Portal's validated state until someone clicks "Publish" there (no automatic release), so a bad upload
# can be dropped before it reaches Central.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Derive the version from the tag and refuse anything that is not a plain version, so a
      # mistyped tag can never publish a wrong coordinate. Central refuses to overwrite a version,
      # so a bad tag must be fixed by publishing a new one.
      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "Tag '$TAG' is not of the form v<major>.<minor>.<patch>[-qualifier]" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Full gate first: a release must never be uploaded from a red build.
      - run: ./gradlew -PreleaseVersion=${{ steps.version.outputs.version }} build

      # Stage every published module into build/staging-deploy (an unqualified task name runs in each
      # module that defines it; fixtures publishes nothing).
      - run: ./gradlew -PreleaseVersion=${{ steps.version.outputs.version }} publishAllPublicationsToStagingRepository

      # JReleaser signs what is staged, checks the POMs and the sources/javadoc jars, and uploads one
      # bundle. Credentials are the Central Portal user token (not the account login) plus the GPG key.
      - run: ./gradlew -PreleaseVersion=${{ steps.version.outputs.version }} :recordbuf-generator:jreleaserDeploy
        env:
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Guard against an upload that was skipped without an error: the bundle must exist.
      - name: Check the deployment bundle was created
        run: |
          bundle="$(find generator/build/jreleaser/deploy -name '*-bundle.zip' 2>/dev/null | head -n 1)"
          if [ -z "$bundle" ]; then
            echo "No deployment bundle was created, so nothing was uploaded to the Central Portal" >&2
            exit 1
          fi
          echo "Uploaded $bundle"

      # JReleaser's log (secrets are masked in it), for diagnosing a rejected deployment. Only the
      # small diagnostic files: the rest of its output directory holds large intermediate build files.
      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-output
          path: |
            generator/build/jreleaser/trace.log
            generator/build/jreleaser/output.properties
          retention-days: 7
