name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin 25 matches the project's Gradle toolchain, so no JDK is downloaded at build time.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/gradle-build-action@v3
        with:
          arguments: build
