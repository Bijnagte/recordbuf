name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin 25 matches the project's Gradle toolchain, so no JDK is downloaded at build time.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # gradle/gradle-build-action is archived; setup-gradle provides the same caching.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build
