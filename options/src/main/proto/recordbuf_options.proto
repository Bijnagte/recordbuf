syntax = "proto2";
import "google/protobuf/descriptor.proto";
package recordbuf;
// When this .proto is fed to protobuf-java's --java_out (e.g. a fixture that opts a
// message in to recordbuf.protobuf_java and ALSO generates the protobuf-java reference),
// the generated reference's descriptor embeds this extension and references
// `recordbuf.RecordbufOptions` — so the extension's generated Java class must be on the
// classpath. `java_package` + `java_multiple_files` place it where the generated refs look
// for it. (The plugin itself does NOT link this class; only the generated protobuf-java
// references do.)
option java_package = "recordbuf";
option java_multiple_files = true;
// Two extension names, each on its own option-message set. A single symbol cannot be declared on
// BOTH MessageOptions and EnumOptions without an "already defined" collision, so the two use
// distinct singular symbol names (the plan's `java_interface` / `java_enum_interface`), matching
// the constants in bijnagte.recordbuf.plugin.model.ModelLoader.
extend google.protobuf.MessageOptions {
    repeated string java_interface = 50000;
    // (recordbuf.protobuf_java) — opt into a STRUCTURAL X<->R converter (Layer B).
    // Singular string naming the java_package that hosts the equivalent protobuf-java
    // reference (`X`). When present on a message, recordbuf emits a nested `Interop`
    // type with `from(X)`/`to(R)` statics; when absent, none is emitted. Like
    // java_interface, it rides the descriptor's UnknownFieldSet as a plain string
    // value the plugin reads off the tag without linking this .proto.
    optional string protobuf_java = 50002;
};
extend google.protobuf.EnumOptions {
    repeated string java_enum_interface = 50001;
};
// (recordbuf.avro) -- per-file enablement of the Avro bridge (FEAT). The bridge is ON by
// default; this FILE-level option OVERRIDES both the global --avro plugin flag and the built-in
// default, so a single file can opt out (RECORDBUF_AVRO_OFF / RECORDBUF_AVRO_NONE) or a single
// file can opt in when the global flag is off. When absent, resolution is
// `--avro flag > built-in default (on)`. The value is an `AvroControl` enum; it rides the
// FileDescriptorProto's unknown-fields as a varint at its assigned tag, which the plugin reads
// by tag without linking this .proto (mirroring how protobuf_java / java_interface are read).
//
// (recordbuf.jackson) -- per-file toggle for the Jackson JSON surface (2026-11-20 Jackson plan),
// ENABLED BY DEFAULT; this FILE-level option is the opt-OUT (an explicit false): an absent
// recordbuf.jackson generates the Jackson annotation surface
// (@JsonProperty wire names, any-getter/any-setter unknown-property retention, flat +
// <oneofName> discriminator oneofs, node-typed dynamic WKT fields), and the consuming module
// must put Jackson on the classpath; only an explicit false generates the byte-identical,
// dependency-free output.
// at its assigned tag, which the plugin reads by tag without linking this .proto.
extend google.protobuf.FileOptions {
    optional recordbuf.AvroControl avro = 50003;
    optional bool jackson = 50004;
};
// (recordbuf.jackson_format) -- per-field rendering for a temporal WKT field
// (google.protobuf.Timestamp / Duration) on a jackson-enabled file: "json" (ISO-8601 text,
// the default) or "canonical" (proto3 JSON-mapping rendering). An unrecognized value fails
// generation at load. (recordbuf.json_name) renames a field's JSON property and
// (recordbuf.json_ignored) keeps a field off the JSON surface, both on a jackson-enabled file;
// the generator reads them (ModelLoader). json_ignored is not enforced on read: see
// docs/known-findings.md. All ride the descriptor's unknown-fields (strings) or uninterpreted
// options, read without linking this .proto.
//
// (recordbuf.java_type) -- per-field named Java type on a singular `string` field: the generated
// record holds the named type (a fully-qualified Java class name) instead of String for that
// field, and every serialization surface (wire, proto3 JSON, Jackson, Avro) carries the plain
// string form, converted through the runtime format registry (bijnagte.recordbuf.runtime.format).
// The option applies only to singular `string` fields (oneof members included) — an empty value,
// a repeated field, or a non-string field is a generation error. The generated record component is
// @Nullable and holds null when the field is absent; a present but unparseable value fails the
// decode. The plugin reads it by tag without linking this .proto; the type itself is neither
// linked nor validated by the plugin (the consumer classpath supplies it).
extend google.protobuf.FieldOptions {
    optional string jackson_format = 50005;
    optional string json_name = 50006;
    optional bool json_ignored = 50007;
    optional string java_type = 50010;
};
// (recordbuf.json_oneof) -- per-oneof override of the discriminator property name on a
// jackson-enabled file (the default is <oneofName>, e.g. "choice").
// (recordbuf.json_oneof_values) is RESERVED for v2 (discriminator value style): declared to
// hold the tag and round-trip, but the current generator does not read it.
extend google.protobuf.OneofOptions {
    optional string json_oneof = 50008;
    optional string json_oneof_values = 50009;
};
// The tri-state for the recordbuf.avro file option. RECORDBUF_AVRO_NONE is the declared-but-neutral
// state (equivalent to "no per-file option": fall through to the global flag / default).
// RECORDBUF_AVRO_ON forces generation on for this file; RECORDBUF_AVRO_OFF forces it off.
enum AvroControl {
    RECORDBUF_AVRO_NONE = 0;
    RECORDBUF_AVRO_ON = 1;
    RECORDBUF_AVRO_OFF = 2;
}
