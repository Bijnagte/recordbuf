// U7 (2026-11-21-005) fixture: a oneof with a recordbuf.json_oneof discriminator override and
// members whose JSON needs a (de)serializer pair (Timestamp, bytes), complementing the main
// oneof.proto fixture (default discriminator; scalar / enum / message members). Same `.rec`
// java_package layout as the other U10 jackson protos.
syntax = "proto3";

package bijnagte.recordbuf.fixture.jackson.oneof;

option java_package = "bijnagte.recordbuf.fixture.jackson.oneof.rec";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "recordbuf_options.proto";

message Event {
  int32 id = 1;
  oneof when {
    option (.recordbuf.json_oneof) = "kind";
    google.protobuf.Timestamp at = 2;
    bytes blob = 3;
    string label = 4;
  }
}
