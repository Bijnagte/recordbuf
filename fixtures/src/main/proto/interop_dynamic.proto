// Interop probe for dynamic well-known types, singular and repeated: Struct, Value, ListValue and
// Any. The recordbuf record is generated from this file (--recordbuf_out); the protobuf-java
// reference is generated from this same file (--java_out). The Interop converter must convert each
// dynamic WKT field through DynamicWkt, in both directions. Avro stays on: the dynamic WKTs ride the
// shared Avro JSON envelope, which round-trips their node values.
syntax = "proto3";

package bijnagte.recordbuf.fixture.interopdynamic;
option java_package = "bijnagte.recordbuf.fixture.interopdynamic";
option java_multiple_files = true;

import "recordbuf_options.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

// The target message comes first in the file (KTD2): every dynamic WKT shape of the Interop arms,
// singular and repeated.
message InteropDynamic {
  // Singular dynamic WKTs: null on the record when absent.
  google.protobuf.Struct optional_struct = 1;
  google.protobuf.Any optional_any = 2;
  google.protobuf.Value optional_value = 3;

  // Repeated dynamic WKTs: every element converts.
  repeated google.protobuf.Struct repeated_struct = 4;
  repeated google.protobuf.Any repeated_any = 5;
  repeated google.protobuf.Value repeated_value = 6;
  repeated google.protobuf.ListValue repeated_list_value = 7;

  option (.recordbuf.protobuf_java) = "bijnagte.recordbuf.fixture.interopdynamic";
}

// The message an Any packs. It lives in this file so the proto3 JSON adapter can resolve its type.
message Payload {
  string note = 1;
  int32 n = 2;
}
