// Per-family interop fixture for the optional field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.optional
// .rec.*) and the reference (bijnagte.recordbuf.fixture.optional.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.optional;
option java_package = "bijnagte.recordbuf.fixture.optional";
option java_multiple_files = true;

// Exactly one top-level message per family proto: the record's public type name
// must match its source filename (Java requires one public type/file).
//
// proto3 carries presence on a SINGULAR field only via the `optional` keyword for
// scalars/enums (a singular message is present-able by default, but we keep the
// keyword for explicitness + a uniform ref proto). Each field below is
// present-able: its Java component is boxed/nullable (@Nullable Integer, String,
// Boolean, and a nested Fixed message), is null when absent, is omitted from the
// wire when null, and decodes to null when the tag is missing. One field per
// shape so the skip-on-encode (null) + null-default-on-decode path is exercised
// across a boxed int, a reference string, a boxed bool, and a nested message.
message Sample {
    optional int32 a = 1;
    // GAP(optional-avro-presence): the Avro schema declares `b` non-nullable, so an absent value
    // cannot be written to Avro (the converter sets null on it).
    optional string b = 2;
    optional bool   c = 3;
    optional Fixed  d = 4;

    // The nested presence target: a length-delimited message field that is omitted
    // from the wire when null and decoded to null when its tag is absent.
    message Fixed {
        int64 value = 1;
    }
}
