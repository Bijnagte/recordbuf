// Reference counterpart of bytes.proto for the bytes field family interop test.
// Same message shape + field numbers; DIFFERENT java_package so the
// protobuf-java reference type (Sample) lives in a sibling package and does
// not collide with the recordbuf record of the same name. The wire bytes
// are field-number-driven and so are identical regardless of Java package.
syntax = "proto3";
package bijnagte.recordbuf.comgen.bytes.ref;
option java_package = "bijnagte.recordbuf.comgen.bytes.ref";
option java_multiple_files = true;

message Sample {
    bytes a = 1;
    bytes b = 2;
}
