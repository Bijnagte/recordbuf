// Reference counterpart of map.proto for the proto3 map<K,V> field family interop
// test. Same message shape + field numbers; a DIFFERENT java_package so the
// protobuf-java reference type lives in a sibling package and does not collide
// with the recordbuf record of the same name. The wire bytes are field-number-
// driven and so are identical regardless of Java package.
syntax = "proto3";
package bijnagte.recordbuf.fixture.map.ref;
option java_package = "bijnagte.recordbuf.fixture.map.ref";
option java_multiple_files = true;

message Sample {
    map<string, int32>  a = 1;
    map<int32, string>  b = 2;
    map<string, bool>   c = 3;
}
