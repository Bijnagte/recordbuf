// Per-family interop fixture for the message field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.message
// .rec.*) and the reference (bijnagte.recordbuf.fixture.message.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.message;
option java_package = "bijnagte.recordbuf.fixture.message";
option java_multiple_files = true;

// A second top-level message the Sample references. Each top-level message gets
// its own generated source file (one public type per file).
message Item {
    int32 id = 1;
    string name = 2;
}

// The record's public type name. Two shapes of a message field are exercised so
// the length-delimited tag + nested encode/decode (writeMessage/readMessage) is
// covered end to end: a singular message (present iff set; omitted when null) and
// a repeated message (zero-or-more nested messages, each length-delimited).
message Sample {
    Item single = 1;
    repeated Item items = 2;
}
