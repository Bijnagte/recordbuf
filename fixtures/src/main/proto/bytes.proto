// Per-family interop fixture for the bytes field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.bytes
// .rec.*) and the reference (bijnagte.recordbuf.fixture.bytes.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.bytes;
option java_package = "bijnagte.recordbuf.fixture.bytes";
option java_multiple_files = true;

// Exactly one top-level message per family proto: the record's public type
// name must match its source filename.
//
// One field at each bytes value shape so the length-delimited raw-byte
// encoding is exercised end to end: an empty array (proto3 default, omitted on
// the wire) and a non-empty array with mixed-sign bytes that forces real
// length-delimited framing and raw byte content (a value with 0x7f and 0x80
// proves sign-extension is off the wire, not a signed primitive).
message Sample {
    bytes a = 1;
    bytes b = 2;
}
