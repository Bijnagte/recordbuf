// Reference counterpart of message.proto for the nested-message field family
// interop test. Same message shapes + field numbers; a DIFFERENT java_package so
// the protobuf-java reference types (Item/Sample) live in a sibling package and
// do not collide with the recordbuf records of the same name. The wire bytes are
// field-number-driven and so are identical regardless of Java package.
syntax = "proto3";
package bijnagte.recordbuf.fixture.message.ref;
option java_package = "bijnagte.recordbuf.fixture.message.ref";
option java_multiple_files = true;

message Item {
    int32 id = 1;
    string name = 2;
}

message Sample {
    Item single = 1;
    repeated Item items = 2;
}
