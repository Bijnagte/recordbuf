// Per-family interop fixture for the fixed field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.fixed
// .rec.*) and the reference (bijnagte.recordbuf.fixture.fixed.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.fixed;
option java_package = "bijnagte.recordbuf.fixture.fixed";
option java_multiple_files = true;

// Exactly one top-level message per family proto: the record's public type
// name must match its source filename (Java requires one public type/file),
// so a self-contained message keeps the file layout trivial. Nested messages
// would live in the same generated file.
//
// One field of EACH fixed/int/float scalar type, each with a distinct
// non-default value so presence + the correct varint-vs-fixed encoding is
// exercised: varint types (int32/uint32/int64/uint64/sint32/sint64), the
// fixed-width family (fixed32/fixed64/sfixed32/sfixed64), and the IEEE
// floating-point types (float/double).
message Sample {
    uint32  a = 1;
    int32   b = 2;
    int64   c = 3;
    uint64  d = 4;
    fixed32 e = 5;
    fixed64 f = 6;
    sfixed32 g = 7;
    sfixed64 h = 8;
    // GAP(float-negative-zero-skipped): the generated encoder compares with `!= 0.0`, which is
    // false for -0.0, so it writes nothing for a field protobuf-java writes (it compares bits).
    double  i = 9;
    float   j = 10;
    sint32  k = 11;
    sint64  l = 12;
}
