// Per-family interop fixture for the packed field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.packed
// .rec.*) and the reference (bijnagte.recordbuf.fixture.packed.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.packed;
option java_package = "bijnagte.recordbuf.fixture.packed";
option java_multiple_files = true;

// Exactly one top-level message per family proto: the record's public type
// name must match its source filename (Java requires one public type/file).
//
// One packed `repeated` field of EACH numeric scalar family. proto3 packs
// repeated scalars by default: a single length-delimited group (tag + varint
// length + a tight sequence of the values) instead of one tag per element. One
// field per packed encoding so the length-delimited framing plus each value
// width (varint vs zigzag vs fixed-width vs IEEE float/double) is exercised.
message Sample {
    // GAP(packed-decode-unpacked-input): the generated decoder reads the length-delimited form only,
    // so a list written unpacked (one tag per element) is not decoded.
    repeated int32  a = 1;
    repeated int64  b = 2;
    repeated fixed32 c = 3;
    repeated fixed64 d = 4;
    repeated float  e = 5;
    repeated double f = 6;
    repeated sint32 g = 7;
    repeated sint64 h = 8;
    repeated uint32 i = 9;
    repeated uint64 j = 10;
}
