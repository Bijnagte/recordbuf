// Per-family interop fixture for oneof members that are not plain scalars / enums / messages: the
// well-known types (structured, wrapper, dynamic) and bytes. A set member is always on the wire,
// zero values included (a oneof member has presence). Under the default-ON Avro bridge every
// member rides the shared {tag, value} oneof wrapper in its Avro form.
syntax = "proto3";

package bijnagte.recordbuf.fixture.oneofwkt;

option java_package = "bijnagte.recordbuf.fixture.oneofwkt";
option java_multiple_files = true;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Sample {
  oneof v {
    google.protobuf.Timestamp at = 1;
    google.protobuf.Int32Value count = 2;
    bytes blob = 3;
    google.protobuf.Value value = 4;
    google.protobuf.Duration span = 5;
    google.protobuf.Empty nothing = 6;
    google.protobuf.FieldMask mask = 7;
    google.protobuf.StringValue text = 8;
  }
}
