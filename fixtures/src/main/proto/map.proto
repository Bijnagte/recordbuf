// Per-family interop fixture for the map field family. A single .proto drives
// both halves at generation time via the recordbuf plugin and the protobuf-gradle
// plugin: the record is emitted to the `.rec` sibling package (via the
// package_suffix=.rec plugin parameter, so recordbuf appends a `.rec` segment to
// each java_package, and the protobuf-java reference is emitted to this family's
// natural java_package via --java_out. The record (bijnagte.recordbuf.fixture.map
// .rec.*) and the reference (bijnagte.recordbuf.fixture.map.*) coexist, so the
// interop test qualifies the record and leaves the reference unqualified.
syntax = "proto3";

package bijnagte.recordbuf.fixture.map;
option java_package = "bijnagte.recordbuf.fixture.map";
option java_multiple_files = true;

// Exactly one top-level message per family proto: the record's public type name
// must match its source filename (Java requires one public type/file).
//
// Three distinct map key/value type families so the entry framing plus each
// field width (length-delimited string key, varint int key/value, bool value)
// is exercised. `map<string,int32>` is the mandatory member.
message Sample {
    map<string, int32>  a = 1;
    map<int32, string>  b = 2;
    map<string, bool>   c = 3;
}
