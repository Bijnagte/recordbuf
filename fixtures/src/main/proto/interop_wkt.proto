// Interop probe for natively mapped well-known types, singular and repeated: the scalar wrappers,
// BytesValue, Duration, Timestamp, FieldMask and Empty. The recordbuf record is generated from this
// file (--recordbuf_out); the protobuf-java reference is generated from this same file (--java_out).
// The Interop converter must convert each WKT field through ProtobufJavaWkt, in both directions.
syntax = "proto3";

package bijnagte.recordbuf.fixture.interopwkt;
option java_package = "bijnagte.recordbuf.fixture.interopwkt";
option java_multiple_files = true;

import "recordbuf_options.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";

// The target message comes first in the file (KTD2): every natively mapped WKT shape of the
// Interop arms, singular and repeated.
message InteropWkt {
  // Singular wrappers: present iff set.
  google.protobuf.BoolValue bool_wrapper = 1;
  google.protobuf.Int32Value int32_wrapper = 2;
  google.protobuf.UInt32Value uint32_wrapper = 3;
  google.protobuf.Int64Value int64_wrapper = 4;
  google.protobuf.UInt64Value uint64_wrapper = 5;
  google.protobuf.FloatValue float_wrapper = 6;
  google.protobuf.DoubleValue double_wrapper = 7;
  google.protobuf.StringValue string_wrapper = 8;
  google.protobuf.BytesValue bytes_wrapper = 9;

  // Singular structured WKTs: non-null with a zero default.
  google.protobuf.Duration duration = 10;
  google.protobuf.Timestamp timestamp = 11;
  google.protobuf.FieldMask field_mask = 12;
  google.protobuf.Empty empty = 13;

  // Repeated wrappers: every element is present.
  repeated google.protobuf.BoolValue repeated_bool_wrapper = 14;
  repeated google.protobuf.Int32Value repeated_int32_wrapper = 15;
  repeated google.protobuf.UInt32Value repeated_uint32_wrapper = 16;
  repeated google.protobuf.Int64Value repeated_int64_wrapper = 17;
  repeated google.protobuf.UInt64Value repeated_uint64_wrapper = 18;
  repeated google.protobuf.FloatValue repeated_float_wrapper = 19;
  repeated google.protobuf.DoubleValue repeated_double_wrapper = 20;
  repeated google.protobuf.StringValue repeated_string_wrapper = 21;
  repeated google.protobuf.BytesValue repeated_bytes_wrapper = 22;

  // Repeated structured WKTs: every element converts, defaults included.
  repeated google.protobuf.Duration repeated_duration = 23;
  repeated google.protobuf.Timestamp repeated_timestamp = 24;
  repeated google.protobuf.FieldMask repeated_field_mask = 25;
  repeated google.protobuf.Empty repeated_empty = 26;

  option (.recordbuf.protobuf_java) = "bijnagte.recordbuf.fixture.interopwkt";
}
