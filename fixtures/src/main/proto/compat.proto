// End-to-end interop fixture that stresses EVERY family at once, in one message,
// for byte-and-semantic parity with protobuf-java. The recordbuf record is
// generated from this file (--recordbuf_out); the protobuf-java reference is
// generated from compat-ref.proto (--java_out) into a sibling `*.ref`
// java_package so the two coexist.
//
// Because the wire bytes are field-number-driven, a single message carrying one
// field of every family proves the generated codec is byte-compatible across the
// whole surface in one shot:
//   * plain int32          (i32 / int-family varint)
//   * fixed64              (fixed-width scalar family)
//   * string               (length-delimited UTF-8)
//   * bytes                (length-delimited raw bytes)
//   * repeated int32       (packed repeated-numeric family)
//   * singular Sub         (nested-message family, present iff set)
//   * repeated Sub         (repeated-nested-message family)
//   * map<string,int32>    (map family; on the wire a repeated Entry message)
//   * optional int32       (proto3 presence family; boxed @Nullable, null when absent)
//
// Field numbers are declared in ASCENDING order. The generated codec emits fields
// in ascending FIELD-NUMBER order (it sorts the encode loop by Field.number()),
// exactly as protobuf-java does, so ascending declaration === ascending tag on the
// wire. The `order` family proves the sort (see OrderTest + order.proto).
syntax = "proto3";

package bijnagte.recordbuf.fixture.combined;
option java_package = "bijnagte.recordbuf.fixture.combined";
option java_multiple_files = true;

// Layer B (feat-protobuf-interop): recordbuf_options.proto must be on the gen-proto
// include path (the fixtures' generateProto task supplies it) so this import and the
// recordbuf.protobuf_java declarations resolve at parse time.
import "recordbuf_options.proto";

// message field's Interop.from/to recurses through its sibling's Interop. Both top-level
// messages here opt in the same way.
message Compat {
    int32        i        = 1;
    fixed64      fx       = 2;
    string       s        = 3;
    bytes        b        = 4;
    repeated int32 packed = 5;
    Sub          nested   = 6;
    repeated Sub subs     = 7;
    map<string, int32> m  = 8;
    optional int32 presence = 9;
    option (.recordbuf.protobuf_java) = "bijnagte.recordbuf.fixture.combined";
}

// The nested-message family's type. A separate top-level message so it generates
// its own Sub.java in the same package (one public type per file). It opts in to
// protobuf-java interop too, so Compat's message-field Interop can recurse through it.
message Sub {
    int32  id    = 1;
    string label = 2;
    option (.recordbuf.protobuf_java) = "bijnagte.recordbuf.fixture.combined";
}
