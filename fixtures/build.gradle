// NOTE: This module is intentionally Groovy (build.gradle, not .kts). This was
// checked empirically by converting to .kts and running generateProto:
// the com.google.protobuf (protobuf-gradle-plugin) per-task DSL is *drivable*
// from Kotlin but not cleanly — a KTS conversion required at least five
// non-trivial workarounds, one of which is unreachable on the KTS script
// classpath:
//   1. includeDirs is a FileCollection (no .from); needs addIncludeDir(files(...)).
//   2. builtins.removeByName("java") is unavailable on the KTS script classpath;
//      the plugin's own `remove`/`id` Kotlin extension holder
//      (ProtobufConfiguratorExtsKt) does not resolve from a .kts build, so even
//      that path is dead. option() on the per-task PluginOptions IS typed and
//      works from both languages.
//   3. `id("java-library")` (not the java`-library` shortcut) and the Test task
//      type must be referenced fully-qualified as org.gradle.api.tasks.testing.Test.
//   4. optionsProtoDir / wktIncludeDir are Provider<Directory>, not FileCollection;
//      they too need files() wrapping to reach addIncludeDir.
// Groovy's runtime dispatch resolves all of these for free (getBuiltins(),
// getIncludeDirs().from(...), the `test` task extension) because the script
// compiles at runtime. A single-module Groovy script is a supported Gradle
// feature and keeps the rest of the build on kotlin-dsl. Revisit only if the
// plugin exposes a fully type-safe per-task Kotlin API.
// (The version catalog keeps `protobuf-gradle-plugin` out: a key on that name
// collides with the `protobuf` prefix in Gradle's generated catalog accessors.
// See libs.versions.toml.)
buildscript {
    // The plugin is not in the version catalog: a `protobuf-gradle-plugin` version
    // key collides with the `protobuf` prefix in Gradle's generated catalog
    // accessors. Use the literal version (see libs.versions.toml comment).
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
    }
}

// U2 (feat-nullaway-generated-code): run NullAway (an Error Prone check) on every Java
// compile task, scoped (OnlyNullMarked=true) to the generated @NullMarked output packages.
// Resolved from the Gradle Plugin Portal (the default plugin management), mirroring
// :recordbuf-runtime / :recordbuf-generator; the protobuf-gradle-plugin stays on the
// buildscript classpath because its per-task DSL forces this module's Groovy form.
plugins {
    alias(libs.plugins.gradle.errorprone)
}

apply plugin: 'java-library'
apply plugin: 'com.google.protobuf'
// protobuf-gradle-plugin 0.10.0 (the latest GA, per Maven Central metadata) calls the
// deprecated Configuration.setVisible(false) on its internal configs, so applying it emits
// "The Configuration.setVisible(boolean) method has been deprecated ... removal in Gradle
// 11". This is an UPSTREAM bug: protobuf-gradle-plugin PR #816 fixes it (guards the
// setVisible call behind a GradleVersion check) but that fix is NOT in 0.10.0 and no
// release newer than 0.10.0 exists yet. The call is inert since Gradle 9.0 (visible has
// no effect), so it is a benign deprecation-only warning -- harmless under the project's
// default warning mode, a hard failure only under `org.gradle.warning.mode=fail`.
// It is not resolvable from this build without a patched / non-release plugin artifact
// (out of scope -- do not patch external libraries), so it is documented and left here
// rather than papered over. Re-visit after a protobuf-gradle-plugin release > 0.10.0 lands.

def GenerateProtoTask = 'com.google.protobuf.gradle.GenerateProtoTask'

// KTD5/R3 (2026-11-01-002): recordbuf_options.proto is NOT a Gradle dependency of
// the generator; the options proto is produced by :recordbuf-options as a plain
// text include directory consumed at generation time.
def optionsProtoDir = project(':recordbuf-options').layout.projectDirectory.dir('src/main/proto')

// KTD6/R3: generation uses the :recordbuf-generator installDist launcher directly,
// by path the plugin was built for — never a glob.
def recordbufLauncher = project(':recordbuf-generator').file(
    'build/install/protoc-gen-recordbuf/bin/protoc-gen-recordbuf',
).absolutePath

// The managed protoc version. Kept literal here (no catalog accessor): a
// `protobuf-gradle-plugin` version key collides with the `protobuf` prefix in
// Gradle's generated version-catalog accessors. See libs.versions.toml comment.
def protocArtifact = 'com.google.protobuf:protoc:4.36.2'
// R8: the same 4.36.2 ref is the live byte-compat oracle (generated java).
def protobufJava = 'com.google.protobuf:protobuf-java:4.36.2'

repositories {
    mavenCentral()
}

// Layer B (feat-protobuf-interop): a message that opts in to recordbuf.protobuf_java
// generates a protobuf-java REFERENCE whose descriptor embeds the extension and therefore
// references recordbuf.RecordbufOptions. Adding the options proto as a main source dir makes
// the java builtin generate that class (into package `recordbuf`) so the refs compile. The
// recordbuf plugin also sees it, but it has no messages/enums, so it emits nothing but an
// empty header file.
sourceSets.main.proto {
    srcDir project(':recordbuf-options').file('src/main/proto')
}

dependencies {
    // The runtime is a compile dependency, not a generated type: generated records
    // are pure Java that only import bijnagte.recordbuf.runtime.*.
    implementation project(':recordbuf-runtime')
    // R5/option B (2026-11-06): the recordbuf bridge now also emits Avro-specific records
    // (generated in-process by Avro's own SpecificCompiler into the same output dir). Those
    // specific records reference org.apache.avro.* on their COMPILE classpath; recordbuf-avro
    // already api-exposes Avro core, so that transitive provides it. This is a runtime
    // dependency, not a build task -- the user's steer was "no gradle task", not no dep.
    implementation project(':recordbuf-avro')
    // Generated records annotate optional/presence fields with @org.jspecify.annotations.Nullable;
    // the annotation is on the compile classpath so the generated code compiles.
    implementation libs.jspecify
    // The 4.36.2 protobuf-java reference (byte-compat oracle, R8). Also the source
    // of the WKT .protos (descriptor.proto) needed to compile recordbuf_options.
    implementation protobufJava
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    // U2: Error Prone + NullAway prove the generated codec is nullness-safe by construction
    // once a package-info carries @NullMarked (U1). error-prone-core loads Error Prone;
    // nullaway is the nullness check. Mirrors :recordbuf-runtime / :recordbuf-generator.
    errorprone libs.nullaway
    errorprone libs.error.prone.core
}

// Extract the Well-Known-Types (.proto) shipped inside the managed protobuf-java jar
// so the recordbuf_options.proto include resolves during generation. The java builtin
// would otherwise supply them; the iface_marker task has the java builtin removed, so
// the WKT dir is provided independently.
def wktIncludeDir = layout.buildDirectory.dir('wkt-include')
def extractWkt = tasks.register('extractWkt', Copy) {
    from configurations.runtimeClasspath
    include 'google/protobuf/*.proto'
    into wktIncludeDir
}

protobuf {
    protoc {
        // R7: single managed protoc, no system protoc.
        artifact = protocArtifact
    }
    // Top-level executable locator; each generate task references it by name.
    plugins {
        create('recordbuf') {
            path = recordbufLauncher
        }
    }
    // R5/R9: two tasks. ofSourceSet('main') handles the byte-compat families
    // (record into .rec sibling + ref at natural pkg via the java builtin);
    // ofSourceSet('test') handles iface_marker (natural record, no ref, no java builtin).
    generateProtoTasks {
        ofSourceSet('main')
        ofSourceSet('test')
        all().configureEach { task ->
            task.plugins.create('recordbuf')
            if (task.name == 'generateProto') {
                // byte-compat families: record -> .rec sibling; ref stays at natural pkg.
                task.plugins.getByName('recordbuf').option('package_suffix=.rec')
                // Layer B (feat-protobuf-interop): recordbuf_options.proto must be on the
                // include path so a fixture's `import "recordbuf_options.proto"` + the
                // `recordbuf.protobuf_java` option resolve at parse time. WKT is supplied
                // by the java builtin automatically; only the options proto is added here.
                task.getIncludeDirs().from(optionsProtoDir)
            } else {
                // iface_marker: natural output, no protobuf-java ref.
                task.getBuiltins().removeByName('java')
                task.getIncludeDirs().from optionsProtoDir, wktIncludeDir
                task.dependsOn extractWkt
            }
        }
    }
}

// KTD6: generation depends on installDist so the launcher exists before protoc runs.
//
// KTD8: the protobuf-gradle-plugin's GenerateProtoTask up-to-date check tracks only the
// .proto sources and the managed protoc artifact -- NOT the custom `recordbuf` plugin
// executable it shells out to. Left to its own devices, recompiling :recordbuf-generator
// rebuilds the launcher yet the generate task still reports up-to-date and emits STALE
// record output. Pointing at the installDist output directory as an input closes that gap
// precisely: regeneration fires when the generator's distribution actually changes and is
// skipped (cached) when it does not.
def recordbufInstallDir = project(':recordbuf-generator').layout.buildDirectory
    .dir('install/protoc-gen-recordbuf').get().asFile
['generateProto', 'generateTestProto'].each { n ->
    tasks.named(n, Class.forName(GenerateProtoTask)).configure {
        dependsOn ':recordbuf-generator:installDist'
        inputs.dir(recordbufInstallDir)
    }
}

// U2 (feat-nullaway-generated-code): run NullAway (plus all other default EP checks)
// on both compile tasks, scoped to the @NullMarked recordbuf .rec packages. The
// protobuf-java REFERENCE output (proto/main/java/, un-suffixed natural package) is
// UNMARKED and out of scope for NullAway; it is also excluded from all EP checks by
// excludedPaths in compileJava, where it contains false positives on
// GeneratedMessage.BuilderParent etc. that are upstream issues, not ours. The .rec
// output remains in full EP scope as a forward-looking guard against regressions in
// the generator — as the generator is refactored, EP catches issues in our output
// early. JSpecifyMode is NOT passed: 0.14.x auto-detects JSpecify on the project's
// JDK 21+ toolchain, so the flag is rejected as invalid on this toolchain combo and
// is omitted (mirrors :recordbuf-runtime / :recordbuf-generator).
//
// compileJava (main source set): the main source set compiles both the protobuf-java
// reference output (proto/main/java/, produced by protoc --java_out) and the recordbuf
// .rec output (proto/main/recordbuf/, generated by our plugin).  We exclude the
// protobuf-java reference by path; all other EP checks run on the .rec output.
//
// compileTestJava (test source set): the test source set has only
// proto/test/recordbuf/ (the java builtin is removed for test protos), so no
// protobuf-java reference is present; run all EP checks unconditionally.
tasks.named("compileJava", JavaCompile).configure {
    options.errorprone {
        error("UnnecessarilyFullyQualified")
        error("NullAway")
        option("NullAway:OnlyNullMarked", "true")
        // UndefinedEquals flags the generated converters' Map<String, _> -> Map<CharSequence, _>
        // boundary (avro strings are CharSequence; the record side is String). The keys ARE
        // Strings -- well-defined equality -- so the check is a false positive on the generated
        // .rec output and is scoped OFF here.
        disable("UndefinedEquals")
        // Exclude the protobuf-java reference (proto/main/java/ -- unmarked, upstream FQN false
        // positives) and the Avro-specific records the SpecificCompiler emits (third-party code,
        // not recordbuf's own .rec output): the per-message *Avro records, the shared
        // RecordbufUnknownField / RecordbufOneofValue carriers, and the WKT avro records in the
        // dedicated avro/wkt package. The .rec files (records + converters) remain in full EP scope.
        // Note: excludedPaths is matched against the FULL file path, so a package prefix must end
        // in ".../" + a trailing ".*" to also match the files inside it ("avro/wkt/" alone only
        // matches the directory, never ".../avro/wkt/Duration.java").
        excludedPaths = '.*/proto/main/java/.*|.*Avro.java|.*RecordbufUnknownField.java|.*RecordbufOneofValue.java|.*avro/wkt/.*'
    }
}

tasks.named("compileTestJava", JavaCompile).configure {
    options.errorprone {
        error("UnnecessarilyFullyQualified")
        error("NullAway")
        option("NullAway:OnlyNullMarked", "true")
        // See the compileJava block above: scoped OFF on the generated .rec converters.
        disable("UndefinedEquals")
        // Exclude the Avro-specific records Avro's SpecificCompiler generates from the test
        // protos (third-party code, not recordbuf's own .rec output): the per-message *Avro
        // records, the shared RecordbufUnknownField / RecordbufOneofValue carriers, and the WKT
        // avro records in the dedicated avro/wkt package. The .rec files (records + converters)
        // remain in full EP scope. The test source set has no protobuf-java reference (the java
        // builtin is removed for test protos), so no path prefix is needed there.
        excludedPaths =
            '.*Avro.java|.*RecordbufUnknownField.java|.*RecordbufOneofValue.java|.*avro/wkt/.*'
    }
}

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    // Avro 1.11+ ClassSecurityValidator: generated specific record classes must be
    // explicitly trusted for binary write/read via SpecificDatumWriter/Reader.
    // The fixture package is safe to trust in a test environment.
    jvmArgs '-Dorg.apache.avro.SERIALIZABLE_PACKAGES=bijnagte.recordbuf.fixture'
}
